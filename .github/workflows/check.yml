name: Проверки
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: API и веб-приложение
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elloria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elloria"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elloria
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm install -g pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Проверить сгенерированные файлы контракта
        run: git diff --exit-code -- api/src/generated
