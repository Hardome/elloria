name: Проверки
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: API и веб-приложение
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elloria
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elloria"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55438/elloria
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm run audit
      - run: pnpm run check
      - name: Проверить сгенерированные файлы контракта
        run: git diff --exit-code -- api/src/generated
      - name: Проверить контейнеры
        run: pnpm run check:containers
      - name: Показать логи контейнеров при ошибке
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Остановить контейнеры
        if: always()
        run: docker compose --profile app down --volumes --remove-orphans
