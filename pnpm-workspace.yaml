packages:
  - api
  - web
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
# The OpenAPI parser pins an affected patch; keep the fix scoped to that package.
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2
minimumReleaseAgeExclude:
  - '@fastify/swagger-ui@6.1.3'
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - lucide-react@1.68.0
  - next@16.4.5
